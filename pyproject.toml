[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "mujocraft"
version = "0.1.0"
description = "Two-way sync between Minecraft and MuJoCo: Minecraft terrain is the environment, a MuJoCo spider is rendered back in-game."
requires-python = ">=3.11"
dependencies = [
  "numpy>=1.26",
  "mujoco>=3.1",
  "gymnasium>=0.29",
]

[project.optional-dependencies]
train = ["stable-baselines3>=2.3"]
test = ["pytest>=8"]

[project.scripts]
mujocraft-live = "mujocraft.live:main"
mujocraft-dump = "mujocraft.dump:main"
mujocraft-train = "mujocraft.train:main"
mujocraft-view = "mujocraft.view:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
